# docker/docker-compose.test.yml
version: '3.8'

name: python_auth_test

services:
  test:
    container_name: app_test
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    volumes:
      - ..:/app:delegated
      - /app/__pycache__
      - /app/*/__pycache__
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=app.settings
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DB_NAME=test_db
      - DB_USER=test_user
      - DB_PASSWORD=test_password
      - DB_HOST=test_db
      - DB_PORT=5432
      - SEND_VERIFICATION_CODE_IN_RESPONSE=1
      - ENVIRONMENT=test
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - SECRET_KEY=test-secret-key
      - SEND_EMAIL=0
      - TESTING=1
      - REDIS_URL=redis://test_redis:6379/0
    networks:
      - test_network
    tty: true
    command: /bin/bash
    entrypoint: ["tail", "-f", "/dev/null"]
    depends_on:
      test_db:
        condition: service_healthy

  test_db:
    container_name: app_test_db
    image: postgres:16
    environment:
      - POSTGRES_DB=test_db
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - test_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  test_redis:
    container_name: app_test_cache
    image: redis:latest
    networks:
      - test_network

networks:
  test_network:
    name: python_auth_test_network
    driver: bridge
